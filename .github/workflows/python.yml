name: Publishing and editorial validation
# Run locally with: python3 tools/validate.py publishing
# Hosted publishing remains available explicitly for macOS/toolchain comparisons.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publishing:
    runs-on: macos-latest
    env:
      HEINLEIN_REQUIRE_GOLDENS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - name: Install fixture-pinned Pandoc and PDF prerequisites
        run: |
          version=$(cat tests/golden/PANDOC_VERSION)
          arch=$(uname -m)
          curl --fail --location --retry 3 "https://github.com/jgm/pandoc/releases/download/${version}/pandoc-${version}-${arch}-macOS.zip" -o "$RUNNER_TEMP/pandoc.zip"
          unzip -q "$RUNNER_TEMP/pandoc.zip" -d "$RUNNER_TEMP/pinned-pandoc"
          pandoc_dir=$(find "$RUNNER_TEMP/pinned-pandoc" -type f -name pandoc -exec dirname {} \;)
          test -n "$pandoc_dir"
          export PATH="$pandoc_dir:$PATH"
          echo "$pandoc_dir" >> "$GITHUB_PATH"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install poppler
          test "$(pandoc --version | head -1)" = "pandoc ${version}"
          if ! test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask google-chrome
          fi
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          pdftotext -v
      - name: Publishing, golden and editorial hook tests
        run: uv run --locked --extra dev pytest -ra
