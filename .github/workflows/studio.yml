name: Studio drafting validation
on:
  merge_group:
  workflow_dispatch:
  pull_request:
    paths: ['studio/**', 'tests/test_studio_updater.py', '.github/workflows/studio.yml']
  push:
    branches: [main]
    paths: ['studio/**', 'tests/test_studio_updater.py', '.github/workflows/studio.yml']
permissions:
  contents: read
jobs:
  studio:
    name: Full browser acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standalone driver provenance (synthetic bytes, no execution)
        run: python -m unittest discover -s macos/tests/native-standalone-probe -p test_driver.py
      - name: Updater transaction and native file/signature boundaries (no Keychain)
        run: python -m unittest discover -s ../tests -p test_studio_updater.py
      - name: Synthetic probe retry tests (memory only; never execute Keychain main)
        run: cargo test --locked --manifest-path macos/tests/keychain-probe/Cargo.toml
      - run: npm ci
      - run: npm test
      - name: Install smoke browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke build gate (synthetic fixtures, desktop and 320px)
        run: npm run test:browser:smoke
        # playwright.config.ts writes results under $TMPDIR; keep them where the upload step looks.
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Keep browser diagnostics when validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-${{ matrix.os }}
          path: ${{ runner.temp }}/heinlein-theme-browser-results
          if-no-files-found: ignore
      - run: npm run build
      - name: Compile isolated standalone fixture assets (never launch native fixture)
        if: runner.os == 'macOS'
        run: |
          npx vite build --config macos/tests/native-standalone-probe/vite.config.ts
          npx vite build --config macos/tests/native-standalone-probe/manual/vite.config.ts
          npx vite build --config macos/tests/native-standalone-probe/picker/vite.config.ts
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p repository-core -p proposal-store -p heinlein-local-mcp -p drafting-questions -p heinlein-chatgpt-auth -p github-workspace
      - name: Native question boundary regressions
        run: cargo test --locked -p heinlein-studio --bin heinlein-studio
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Standalone fixture isolation gates and feature compile (no GUI or stores)
        if: runner.os == 'macOS'
        run: |
          cargo test --locked -p heinlein-studio --features standalone-native-acceptance,tauri/custom-protocol isolation_tests
          cargo clippy --locked -p heinlein-studio --features standalone-native-acceptance,tauri/custom-protocol --all-targets -- -D warnings
      - name: Native proposal authority regressions
        run: |
          cargo test --locked --manifest-path crates/proposal-authority-test-harness/Cargo.toml
          cargo clippy --locked --manifest-path crates/proposal-authority-test-harness/Cargo.toml --all-targets -- -D warnings
      - name: Targeted review lineage regressions
        run: |
          cargo test --locked --manifest-path crates/review-state-test-harness/Cargo.toml
          cargo clippy --locked --manifest-path crates/review-state-test-harness/Cargo.toml --all-targets -- -D warnings
      - run: npm run tauri build -- --no-bundle
