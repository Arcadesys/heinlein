name: Studio drafting validation
on:
  pull_request:
    paths: ['studio/**', '.github/workflows/studio.yml']
  push:
    branches: [main]
    paths: ['studio/**', '.github/workflows/studio.yml']
permissions:
  contents: read
jobs:
  studio:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p repository-core -p proposal-store -p heinlein-local-mcp
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native proposal authority regressions
        run: |
          cargo test --locked --manifest-path crates/proposal-authority-test-harness/Cargo.toml
          cargo clippy --locked --manifest-path crates/proposal-authority-test-harness/Cargo.toml --all-targets -- -D warnings
      - run: npm run tauri build -- --no-bundle
