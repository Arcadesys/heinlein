[package]
name = "heinlein-studio"
version = "1.5.0-rc.2"
edition = "2021"

[features]
default = []
standalone-native-acceptance = []
standalone-ok-diagnostic = ["standalone-native-acceptance", "dep:cc"]
standalone-ok-diagnostic-probes = ["standalone-ok-diagnostic"]
revision-native-acceptance = []
update-native-acceptance = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = { version = "=1.8.0", optional = true }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
fontdb = "0.24"
github-workspace = { path = "../crates/github-workspace" }
repository-core = { path = "../crates/repository-core" }
proposal-store = { path = "../crates/proposal-store" }
drafting-questions = { path = "../crates/drafting-questions" }
heinlein-chatgpt-auth = { path = "../crates/chatgpt-auth" }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
