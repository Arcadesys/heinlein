[package]
name = "heinlein-studio"
version = "1.5.0-rc.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
fontdb = "0.24"
repository-core = { path = "../crates/repository-core" }
proposal-store = { path = "../crates/proposal-store" }
drafting-questions = { path = "../crates/drafting-questions" }
heinlein-chatgpt-auth = { path = "../crates/chatgpt-auth" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
