# Test-only harness: compile the exact native authority module without GTK/Tauri.
[package]
name = "proposal-authority-test-harness"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[lib]
path = "../../src-tauri/src/proposals/authority.rs"
[dependencies]
repository-core = { path = "../repository-core" }
proposal-store = { path = "../proposal-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
[dev-dependencies]
tempfile = "3"
