[package]
name = "github-workspace"
version = "0.1.0"
edition = "2021"

[dependencies]
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
unicode-normalization = "0.1"
repository-core = { path = "../repository-core" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
