[package]
name = "proposal-store"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
repository-core = { path = "../repository-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
